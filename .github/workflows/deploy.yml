name: Deploy

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'

# AWS_REGION and deploy role ARNs are resolved from GitHub organization-level
# Actions variables (D-070, D-071) — not hardcoded per repo.
env:
  FUNCTION_NAME: heediq-api
  AUTH_PROVISION_FUNCTION_NAME: heediq-auth-provision
  AUTH_TRIGGER_PRE_SIGNUP_FUNCTION_NAME: heediq-auth-trigger-pre-signup
  AUTH_TRIGGER_POST_CONFIRMATION_FUNCTION_NAME: heediq-auth-trigger-post-confirmation
  AUTH_TRIGGER_POST_AUTHENTICATION_FUNCTION_NAME: heediq-auth-trigger-post-authentication
  # WebSocket handlers (D-109). Infra creates these as placeholder shells (WebSocketStack);
  # their real code ships from this repo — they must deploy here or they stay placeholders
  # (the pre-2026-07-23 "WS-CD gap"). Handler → function name mapping is in
  # heediq-infra/lib/websocket/websocket-stack.ts.
  WS_CONNECT_FUNCTION_NAME: heediq-ws-connect
  WS_PUSHER_FUNCTION_NAME: heediq-ws-status-pusher
  WS_CLASSIFICATION_PUSHER_FUNCTION_NAME: heediq-ws-classification-pusher

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@heediq'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Bundle
        run: pnpm run bundle

      - name: Bundle auth-provision
        run: pnpm run bundle:auth-provision

      - name: Bundle auth-trigger-pre-signup
        run: pnpm run bundle:auth-trigger-pre-signup

      - name: Bundle auth-trigger-post-confirmation
        run: pnpm run bundle:auth-trigger-post-confirmation

      - name: Bundle auth-trigger-post-authentication
        run: pnpm run bundle:auth-trigger-post-authentication

      - name: Bundle ws-connect
        run: pnpm run bundle:ws-connect

      - name: Bundle ws-pusher
        run: pnpm run bundle:ws-pusher

      - name: Bundle classification-pusher
        run: pnpm run bundle:classification-pusher

      - name: Zip
        run: |
          zip -j dist/lambda.zip dist/index.js
          zip -j dist/auth-provision.zip dist/auth-provision.js
          zip -j dist/auth-trigger-pre-signup.zip dist/auth-trigger-pre-signup.js
          zip -j dist/auth-trigger-post-confirmation.zip dist/auth-trigger-post-confirmation.js
          zip -j dist/auth-trigger-post-authentication.zip dist/auth-trigger-post-authentication.js
          # WS handler Lambdas run under handler `index.handler` (WebSocketStack placeholders),
          # so each zip must contain index.js — stage per-handler into its own dir to avoid
          # clobbering the API's dist/index.js.
          for h in ws-connect ws-pusher classification-pusher; do
            mkdir -p "dist/$h" && cp "dist/$h.js" "dist/$h/index.js" && zip -j "dist/$h.zip" "dist/$h/index.js"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: |
            dist/lambda.zip
            dist/auth-provision.zip
            dist/auth-trigger-pre-signup.zip
            dist/auth-trigger-post-confirmation.zip
            dist/auth-trigger-post-authentication.zip
            dist/ws-connect.zip
            dist/ws-pusher.zip
            dist/classification-pusher.zip
          retention-days: 1

  deploy-dev:
    name: Deploy → dev
    needs: build
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Lambda
        run: aws lambda update-function-code --function-name ${{ env.FUNCTION_NAME }} --zip-file fileb://lambda.zip

      - name: Deploy auth-provision Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_PROVISION_FUNCTION_NAME }} --zip-file fileb://auth-provision.zip

      - name: Deploy auth-trigger-pre-signup Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_PRE_SIGNUP_FUNCTION_NAME }} --zip-file fileb://auth-trigger-pre-signup.zip

      - name: Deploy auth-trigger-post-confirmation Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_POST_CONFIRMATION_FUNCTION_NAME }} --zip-file fileb://auth-trigger-post-confirmation.zip

      - name: Deploy auth-trigger-post-authentication Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_POST_AUTHENTICATION_FUNCTION_NAME }} --zip-file fileb://auth-trigger-post-authentication.zip

      - name: Deploy ws-connect Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_CONNECT_FUNCTION_NAME }} --zip-file fileb://ws-connect.zip

      - name: Deploy ws-pusher Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_PUSHER_FUNCTION_NAME }} --zip-file fileb://ws-pusher.zip

      - name: Deploy classification-pusher Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_CLASSIFICATION_PUSHER_FUNCTION_NAME }} --zip-file fileb://classification-pusher.zip

  # D-156 promote-to-staging gate. A push to `main` is the develop→main promotion, so `main` HEAD ==
  # what already runs on the dev stack. We therefore prove the FULL real backend (real Cognito auth,
  # real REST + WebSocket, real summarization/chat workers, real data create+teardown) against the
  # live DEV stack before letting the promotion reach staging/prod. This runs ONLY on `main` — never
  # per-PR, never on the dev deploy (D-156). The GPU audio path (`e2e:audio`) stays opt-in and is not
  # part of this gate. Needs a seeded, CONFIRMED dev test user with a permanent password + a Cognito
  # app client with USER_PASSWORD_AUTH enabled (see tests/e2e/README.md).
  e2e:
    name: E2E gate (full real-backend → dev stack)
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@heediq'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploy role in the dev workload account — used here only to read the stack's SSM config.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read E2E targets from SSM (dev account)
        id: ssm
        run: |
          echo "api_base=$(aws ssm get-parameter --name /heediq/api/endpoint-url --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "ws_url=$(aws ssm get-parameter --name /heediq/api/ws-endpoint-url --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(aws ssm get-parameter --name /heediq/api/cognito-client-id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      # The suite provisions its own Cognito ID token via USER_PASSWORD_AUTH (no AWS creds needed for
      # that leg) from the seeded dev test user, then drives the real capture→classify→review→file→chat
      # loop end to end and tears its data down. A non-zero exit blocks deploy-staging (and thus prod).
      - name: Run full real-backend E2E (D-156)
        run: pnpm run e2e
        env:
          API_BASE: ${{ steps.ssm.outputs.api_base }}
          WS_URL: ${{ steps.ssm.outputs.ws_url }}
          COGNITO_CLIENT_ID: ${{ steps.ssm.outputs.cognito_client_id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

  deploy-staging:
    name: Deploy → staging
    needs: [build, e2e]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Lambda
        run: aws lambda update-function-code --function-name ${{ env.FUNCTION_NAME }} --zip-file fileb://lambda.zip

      - name: Deploy auth-provision Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_PROVISION_FUNCTION_NAME }} --zip-file fileb://auth-provision.zip

      - name: Deploy auth-trigger-pre-signup Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_PRE_SIGNUP_FUNCTION_NAME }} --zip-file fileb://auth-trigger-pre-signup.zip

      - name: Deploy auth-trigger-post-confirmation Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_POST_CONFIRMATION_FUNCTION_NAME }} --zip-file fileb://auth-trigger-post-confirmation.zip

      - name: Deploy auth-trigger-post-authentication Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_POST_AUTHENTICATION_FUNCTION_NAME }} --zip-file fileb://auth-trigger-post-authentication.zip

      - name: Deploy ws-connect Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_CONNECT_FUNCTION_NAME }} --zip-file fileb://ws-connect.zip

      - name: Deploy ws-pusher Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_PUSHER_FUNCTION_NAME }} --zip-file fileb://ws-pusher.zip

      - name: Deploy classification-pusher Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_CLASSIFICATION_PUSHER_FUNCTION_NAME }} --zip-file fileb://classification-pusher.zip

  deploy-prod:
    name: Deploy → prod
    needs: deploy-staging
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Lambda
        run: aws lambda update-function-code --function-name ${{ env.FUNCTION_NAME }} --zip-file fileb://lambda.zip

      - name: Deploy auth-provision Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_PROVISION_FUNCTION_NAME }} --zip-file fileb://auth-provision.zip

      - name: Deploy auth-trigger-pre-signup Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_PRE_SIGNUP_FUNCTION_NAME }} --zip-file fileb://auth-trigger-pre-signup.zip

      - name: Deploy auth-trigger-post-confirmation Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_POST_CONFIRMATION_FUNCTION_NAME }} --zip-file fileb://auth-trigger-post-confirmation.zip

      - name: Deploy auth-trigger-post-authentication Lambda
        run: aws lambda update-function-code --function-name ${{ env.AUTH_TRIGGER_POST_AUTHENTICATION_FUNCTION_NAME }} --zip-file fileb://auth-trigger-post-authentication.zip

      - name: Deploy ws-connect Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_CONNECT_FUNCTION_NAME }} --zip-file fileb://ws-connect.zip

      - name: Deploy ws-pusher Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_PUSHER_FUNCTION_NAME }} --zip-file fileb://ws-pusher.zip

      - name: Deploy classification-pusher Lambda
        run: aws lambda update-function-code --function-name ${{ env.WS_CLASSIFICATION_PUSHER_FUNCTION_NAME }} --zip-file fileb://classification-pusher.zip
